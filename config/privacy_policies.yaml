# ==============================================================================
# Face Anonymization Privacy Policies Configuration
# ==============================================================================
# This configuration defines extensible privacy policies for Intel DL Streamer.
# The policy layer maps policy names to inference parameters, ROI modification rules,
# and downstream anonymization operations.
#
# Supported policies:
#   - STANDARD: Standard privacy blur via DL Streamer gvawatermark
#   - HIGH_PRIVACY: Strong blur with 25% expanded ROI coverage
#   - ZERO_TRUST: Encrypted ROI pipeline representation (staged for future crypto module)
# ==============================================================================

version: "1.0"
default_policy: "STANDARD"

policies:
  STANDARD:
    description: "Standard privacy preservation using default DL Streamer Gaussian blur"
    anonymization: "blur"
    confidence: 0.5
    inference_interval: 2
    tracking_type: "short-term-imageless"
    roi_padding: "0%"
    target_labels:
      - "face"
    enabled: true

  HIGH_PRIVACY:
    description: "High privacy anonymization with expanded ROI padding for perimeter coverage"
    anonymization: "strong_blur"
    confidence: 0.5
    inference_interval: 2
    tracking_type: "short-term-imageless"
    roi_padding: "25%"
    target_labels:
      - "face"
    enabled: true

  ZERO_TRUST:
    description: "Reversible cryptographic privacy protection using authenticated AES-256-GCM ROI encryption with unique nonces and AAD binding"
    anonymization: "encryption"
    confidence: 0.35
    inference_interval: 2
    tracking_type: "short-term-imageless"
    roi_padding: "25%"
    target_labels:
      - "face"
    enabled: true
    notes: "Full AES-256-GCM authenticated encryption active with secure key loading."

# Registry of supported anonymization methods and their DL Streamer handling strategy
anonymization_methods:
  blur:
    handler: "dlstreamer_gvawatermark"
    supported_in_pipeline: true
    description: "Built-in DL Streamer gvawatermark OpenCV GaussianBlur"
  strong_blur:
    handler: "dlstreamer_gvawatermark_padded"
    supported_in_pipeline: true
    description: "Padded ROI blur with increased effective kernel size and perimeter coverage"
  encryption:
    handler: "roi_encryptor_aes_256_gcm"
    supported_in_pipeline: true
    description: "Authenticated AES-256-GCM symmetric encryption with unique 96-bit nonces, 128-bit tags, and AAD tamper prevention"
